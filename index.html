<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zui Notebook</title>
<meta name="description" content="Catatan sederhana untuk semua usia. Bisa dipakai tanpa internet dan tersinkron di semua perangkat.">
<meta name="theme-color" content="#F7F5F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zui Notebook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<script>
  // Terapkan pengaturan tampilan sebelum halaman digambar, agar tidak berkedip.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('zn-settings') || '{}');
      var r = document.documentElement;
      r.dataset.theme = s.theme || 'terang';
      r.dataset.fs = s.fontSize || 'sedang';
      r.dataset.contrast = s.highContrast ? 'tinggi' : 'normal';
      r.dataset.labels = s.labels ? 'on' : 'off';
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="skip" href="#main">Langsung ke isi</a>
<div id="app" aria-live="off">
  <div class="boot" role="status">Memuat…</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Zui Notebook membutuhkan JavaScript agar bisa berjalan.</noscript>
</body>
</html>
